# Publica a pasta site/ no GitHub Pages a cada push que mexe nela.
name: Publicar site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Upload e deploy em jobs separados: no mesmo job, o deploy-pages às vezes consulta
# o artefato antes de a API do GitHub registrá-lo e falha com
# 'No artifacts named "github-pages"' (actions/deploy-pages#451).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
